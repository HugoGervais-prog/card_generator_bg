<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon card generator</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="css/style_r.css?v=14" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/dashboard.css?v=6" rel="stylesheet">

    <script src="https://code.jquery.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/jquery-google-sheet-to-json.js"></script>
    <script src="js/jquery.csv.js"></script>
    <script src="js/card-rules.js?v=4"></script>
    <script src="js/dashboard.js?v=12"></script>
</head>
<body>

    <div class="app-container">
        
        <div class="card-section">
            <div class="card_content" id="capture">
                <div class="card_bg"></div>

                <div class="portrait_box">
                    <img class="card_portrait" src="img/sprite/0001 Bulbasaur.png">
                </div>


                <img class="card_frame" src="img/base_frame/B_simple.png" width="810" height="1110">
                

                <p class="card_name">Bulbasaur</p>

                <!-- Stage (Basic / Stage 1 / Stage 2) and the Pokémon it evolves from, like the TCG; filled from PokéAPI -->
                <div class="stage_box" hidden>
                    <span class="stage_label">BASIC</span>
                    <div class="evo_bubble"><img class="evo_sprite" alt=""></div>
                </div>

                <div class="cost_row"></div>

                
                <p class="ability_name">Overgrown</p>
                <p class="ability_text">+1 for each fire pokémon in the same column as this pokémon, but -1 for each water pokémon in the same row.</p>

                <img class="type_icons p1_type" src="img/type/grass.png">
                <img class="type_icons p2_type" src="img/type/grass.png">
                
                <img class="c_icons" src="img/icons/ball.png">
                <p class="capture_rate">29</p>

                <div class="info_bar"></div>
                <p class="index">0001</p>

                <img class="ruler_icon" src="img/ruler.png">
                <p class="height">999.99 m</p>

                <img class="weight_icon" src="img/weight.png">
                <p class="weight">999.99 kg</p>

                <img class="egg_icon" src="img/egg-white.png">
                <p class="egg_groups"></p>

            </div>
        </div>

        <div class="sidebar-section">
            <button id="download-btn"><i class="bi bi-download"></i> Download Image</button>

            <details class="edit-panel" open>
                <summary><h2>Edit Card</h2></summary>
                <div class="balance-note" hidden>
                    <div class="balance-note-head"><span class="note_dot"></span><span class="balance-note-label"></span></div>
                    <p class="balance-note-text"></p>
                    <button id="resolve-note-btn" type="button">Mark resolved</button>
                </div>
                <div class="edit-grid">
                    <label>Name<input id="edit-name"></label>
                    <label>Rarity
                        <select id="edit-rarity">
                            <option value="B">B - Beginner</option>
                            <option value="I">I - Intermediate</option>
                            <option value="A">A - Advanced</option>
                            <option value="E">E - Expert</option>
                            <option value="M">M - Mythic</option>
                            <option value="L">L - Legendary</option>
                        </select>
                    </label>
                    <label>Type 1<select id="edit-type1" class="type-select"></select></label>
                    <label>Type 2<select id="edit-type2" class="type-select"><option value="">(none)</option></select></label>
                    <label>Points<input id="edit-points" type="number" min="0" step="1"></label>
                    <label><span class="label-row">Area cost <span class="ref-tip align-right" tabindex="0" aria-label="Symbol reference">?<span class="ref-tip-box"></span></span></span><input id="edit-cost" placeholder="{2}{WAT}"></label>
                    <span class="field-hint full">Changing Rarity or a type resets Points and Area cost to that rarity's defaults.</span>
                    <label class="full">Ability name<input id="edit-ability-name"></label>
                    <label class="full"><span class="label-row">Ability effect <span class="ref-tip" tabindex="0" aria-label="Symbol reference">?<span class="ref-tip-box"></span></span></span>
                        <textarea id="edit-ability-effect" rows="4"></textarea>
                        <span class="field-hint"><span id="effect-length">0</span> characters &middot; icons: {WAT} {FIR} {GRA}&hellip; &middot; pips: {2} {X}</span>
                    </label>
                </div>
                <div class="edit-buttons">
                    <button id="revert-btn" type="button">Revert</button>
                    <button id="save-btn" type="button">Save to CSV</button>
                    <button id="save-resolve-btn" type="button" hidden>Save &amp; mark resolved</button>
                </div>
                <p class="save-status"></p>
            </details>

            <div class="roster-panel">
                <div class="roster-header">
                    <h2>Pokémon Roster</h2>
                    <div class="roster-nav">
                        <button type="button" id="prev-pokemon" title="Previous Pokémon" aria-label="Previous Pokémon"><i class="bi bi-chevron-left"></i></button>
                        <button type="button" id="next-pokemon" title="Next Pokémon" aria-label="Next Pokémon"><i class="bi bi-chevron-right"></i></button>
                    </div>
                </div>
                <p class="note-legend"></p>
                <div class="button_table">
                    </div>
            </div>
        </div>

        <div class="dashboard-section"></div>
    </div>

    <script>
        var aPokemonData;
       $(document).ready(function() {
            $("#download-btn").click(function() {
                const element = document.getElementById('capture');

                // Ajout des options pour gérer le Cross-Origin (CORS)
                html2canvas(element, {
                    useCORS: true,        // Autorise le chargement d'images externes via CORS
                    allowTaint: false,    // Empêche de "souiller" le canvas avec des données non sécurisées
                    logging: false        // Changez en true si vous voulez déboguer dans la console
                }).then(canvas => {
                    try {
                        // Création du lien de téléchargement
                        const link = document.createElement('a');
                        link.download = $(".index").html() + '-' + $(".card_name").html()  + '.png';
                        
                        // On génère l'URL de l'image
                        link.href = canvas.toDataURL("image/png");

                        // Ajout, clic et suppression du lien
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        goToNextPokemon(); // ready for the next download
                    } catch (err) {
                        console.error("Erreur lors de l'exportation de l'image :", err);
                        alert("Impossible de capturer l'image à cause de restrictions de sécurité sur certaines ressources (CORS).");
                    }
                });
            });

            $.ajax({
                url: 'data/data_r.csv', // Path to your CSV file
                dataType: 'text', cache: false, // always read the current file, not a cached copy
                success: function(csvData) {
                    // Process the data once it's successfully loaded
                    parseCsvWithPlugin(csvData);
                }
            });

        });

        function parseCsvWithPlugin(csvData) {
            // Convert to a 2D array
            var arrayData = $.csv.toArrays(csvData);
            var lastId = 0;

            var params = new URLSearchParams(window.location.search);
            var urlId = params.get("id");

            // Convert to an array of objects (useful if your CSV has a header row)
            aPokemonData = $.csv.toObjects(csvData);
            //Fill Menu deroulant with list of pokemon
            var $select = $("#menu_pokemon");
            var totalPokemon = 0;
            

            // Remove existing options
            $select.empty();
            $.each(aPokemonData, function(index, pokemon) {

                var paddedID = String(dexNumber(pokemon)).padStart(4, '0');

                
                if (pokemon.Name && pokemon.Name.trim() !== "") {
                    lastId = index;
                    $select.append(
                        $("<option>", {
                            value: pokemon.ID,
                            text: "#" + paddedID + " " + pokemon.Name,
                            selected: urlId ? (pokemon.ID == urlId) : true
                        })
                        
                    );
                    totalPokemon = totalPokemon+1;
                    $(".button_table").append('<button class="pokemon_button gen' + pokemonGeneration(pokemon) + '" id="' + pokemon.ID + '"><img src="' + spritePath(pokemon) + '"></button>');
                    updateNoteIndicator(pokemon);


                }

            });

            $(".total").html(totalPokemon + ' / ' + (totalPokemon/9).toFixed(2)  + ' sheets');
            updateNoteLegend();
            renderDashboard();

            $select.on("change", function() {

                var selectedValue = $(this).val();

                // Add ID to URL as parameter
                var url = new URL(window.location);
                url.searchParams.set("id", selectedValue);
                window.history.replaceState({}, "", url);

                // Load the data
                loadPokemonData(indexOfId(selectedValue));

            });

            if (urlId) {
                loadPokemonData(indexOfId(urlId));
            } else {
                loadPokemonData(lastId);
            }

            $(".pokemon_button").on("click", function() {

                var id = parseInt(this.id, 10);

                // Update select menu
                $("#menu_pokemon").val(id);

                // Update URL
                var url = new URL(window.location);
                url.searchParams.set("id", id);
                window.history.replaceState({}, "", url);

                // Load Pokémon data
                loadPokemonData(indexOfId(id));

            });

        }

        function loadPokemonData(index) {
            if (!aPokemonData[index]) return;
            curIndex = index;
            fillEditForm(aPokemonData[index]);
            renderCard(aPokemonData[index]);
            fitRosterToCard(); // the balancing note box changes the edit panel's height
            selectRosterButton(aPokemonData[index].ID);
        }

        // The roster panel ends flush with the bottom of the card preview: the grid gets whatever height is left
        // under the download button and edit panel. When the sidebar wraps below the card, the CSS max-height applies.
        var ROSTER_MIN_H = 160;
        function fitRosterToCard() {
            var card = document.querySelector(".card-section"), panel = document.querySelector(".roster-panel"),
                grid = document.querySelector(".button_table");
            if (!card || !panel || !grid) return;
            var c = card.getBoundingClientRect(), pr = panel.getBoundingClientRect();
            if (pr.left < c.right) { grid.style.height = ""; grid.style.maxHeight = ""; return; } // not beside the card
            var g = grid.getBoundingClientRect();
            var under = pr.bottom - g.bottom; // panel padding + border below the grid
            grid.style.maxHeight = "none";
            grid.style.height = Math.max(ROSTER_MIN_H, c.bottom - g.top - under) + "px";
        }
        $(function() {
            $(window).on("resize", fitRosterToCard);
            $(".edit-panel").on("toggle", fitRosterToCard);
            if (window.ResizeObserver) {
                var ro = new ResizeObserver(fitRosterToCard);
                [".card-section", ".edit-panel", "#download-btn"].forEach(function(sel) { var el = document.querySelector(sel); if (el) ro.observe(el); });
            }
            fitRosterToCard();
        });

        // Opens the card at a row of aPokemonData, keeping the menu and the ?id= in the URL in step
        function openPokemonAt(index) {
            var p = aPokemonData[index];
            if (!p) return;
            $("#menu_pokemon").val(p.ID);
            var url = new URL(window.location);
            url.searchParams.set("id", p.ID);
            window.history.replaceState({}, "", url);
            loadPokemonData(index);
        }

        // Next / previous Pokémon in the list (skips empty placeholder rows); stays put at either end
        function goToNextPokemon() { stepPokemon(1); }
        function goToPrevPokemon() { stepPokemon(-1); }
        function stepPokemon(dir) {
            for (var i = curIndex + dir; i >= 0 && i < aPokemonData.length; i += dir) {
                if (aPokemonData[i].Name && aPokemonData[i].Name.trim() !== "") { openPokemonAt(i); return; }
            }
        }
        $(function() {
            $("#prev-pokemon").on("click", goToPrevPokemon);
            $("#next-pokemon").on("click", goToNextPokemon);
        });

        // Yellow outline on the selected Pokémon's button; scroll the roster grid (not the page) to it if it's out of view
        function selectRosterButton(id) {
            var $btn = $(".pokemon_button").removeClass("active").filter('[id="' + id + '"]').addClass("active");
            var grid = document.querySelector(".button_table");
            if (!$btn.length || !grid) return;
            var g = grid.getBoundingClientRect(), r = $btn[0].getBoundingClientRect();
            if (r.top < g.top || r.bottom > g.bottom) {
                grid.scrollTop += (r.top - g.top) - (grid.clientHeight - r.height) / 2; // centre it in the grid
            }
        }

        // Sizes the ability box to its text. The box's bottom edge stays just above the points bar and it grows upward;
        // the font only shrinks when the text would be taller than ABILITY_MAX_TEXT_H.
        var ABILITY_BOX_BOTTOM = 894;   // bottom edge of the dark box (card pixels), just above the points bar
        var ABILITY_TEXT_INSET = 6;     // space between the last line of text and the bottom of the box
        var ABILITY_MAX_TEXT_H = 200;   // tallest text block before the font shrinks (4 lines at 36px)
        var ABILITY_MIN_FONT = 32;      // never smaller, so printed cards stay readable; past that the box grows taller
        var ABILITY_NAME_GAP = 54;      // from the top of the box to the top of the text (room for the ability name)
        function layoutAbilityBox() {
            var $name = $(".ability_name"), $text = $(".ability_text");
            if (!$name.is(":visible")) return;
            $name.css("margin", 0); // positions below are the visible edges, so drop the default <p> margins
            $text.css({ margin: 0, height: "auto", top: "0px" });
            var size = 36;
            $text.css("font-size", size + "px");
            while ($text[0].offsetHeight > ABILITY_MAX_TEXT_H && size > ABILITY_MIN_FONT) { size--; $text.css("font-size", size + "px"); }
            var textTop = ABILITY_BOX_BOTTOM - ABILITY_TEXT_INSET - $text[0].offsetHeight;
            var nameTop = textTop - ABILITY_NAME_GAP;
            $text.css("top", textTop + "px");
            $name.css({ top: nameTop + "px", height: (ABILITY_BOX_BOTTOM - nameTop - 20) + "px" }); // 20 = the box's padding
            $(".portrait_box").css("top", size < 36 ? "100px" : "150px");
        }
        // Re-measure once the card font has loaded and whenever an icon inside the text finishes loading
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(function() { layoutAbilityBox(); fitEggGroups(); fitCardName(); });
        $(function() { $(".ability_text").each(function() { this.addEventListener("load", layoutAbilityBox, true); }); });

        function renderCard(p) {
            var ID = p.ID;
            var name = p.Name;
            var ability_r_name = p.Ability_R_Name || "";
            var ability_r_effect = p.Ability_R_Effect || "";
            var rarity = p.Rarity;
            var type1 = p.Type1;
            var type2 = p.Type2;      

            if (rarity == "L") {
                $(".card_frame").attr("src", "img/base_frame/" + rarity + "_simple.png");
            }else{
                $(".card_frame").attr("src", "img/base_frame/N_simple.png");
            }
        
            $(".card_name").html(name);

            var paddedID = String(dexNumber(p)).padStart(4, '0');


            $(".card_portrait").show();
            $(".a_box_border").show();
            $(".card_portrait").attr("src", spritePath(p));

            $(".gen_tag").html(pokemonGeneration(p) + ' - ' + pokemonRegion(p));
            if(ability_r_name.length){
                $(".ability_name").show();
                $(".ability_text").show();

                $(".ability_name").html(ability_r_name);
                $(".ability_text").html(colorTypeWords(replaceTypeIcons(ability_r_effect)));

                layoutAbilityBox();
            }else{
                $(".ability_name").hide();
                $(".ability_text").hide();
            }

            $(".index").html(paddedID + ' - ' + pokemonRegion(p));

            // Height, weight, egg groups (Height_m, Weight_kg, Egg_Groups) and the stage badge (Stage, Evolves_From)
            // come from the CSV. PokéAPI is only called for a card whose cells are empty.
            var statsFromCsv = p.Height_m != null && String(p.Height_m).trim() !== "";
            var stageFromCsv = p.Stage != null && String(p.Stage).trim() !== "";
            if (stageFromCsv) renderStageFromCsv(p);
            if (statsFromCsv) {
                $(".height").text(p.Height_m + " m");
                $(".weight").text(p.Weight_kg + " kg");
                $(".egg_groups").text(p.Egg_Groups || "");
                fitEggGroups();
            }

            if (statsFromCsv && stageFromCsv) { lastDimsId = ID; /* everything is in the CSV */ } else
            if (ID === lastDimsId) { /* already fetched for this Pokémon */ } else
            getPokemonDimensions(lastDimsId = ID).then(pokemon => {
                if (!aPokemonData[curIndex] || aPokemonData[curIndex].ID !== ID) return; // another card was opened meanwhile
                if (pokemon) {
                    if (!statsFromCsv) {
                        $(".height").text(pokemon.height.meters + " m");
                        $(".weight").text(pokemon.weight.kg + " kg");
                        $(".egg_groups").text(pokemon.eggGroups.join(" / "));
                        fitEggGroups();
                    }
                    if (!stageFromCsv) renderStage(pokemon.stage);
                } else {
                    if (!stageFromCsv) renderStage(null);
                    if (!statsFromCsv) { $(".egg_groups").text(""); fitEggGroups(); }
                }
            });

            $(".p1_type").attr("src", "img/type/" + type1 + ".png");
            $(".c1_type").attr("src", "img/type/" + type1 + ".png");

            setCardBackground(p, type1, type2);
            $(".card_content").css("width", "810px");
            $(".card_content").css("height", "1110px");
            $(".card_content").css("background-repeat", "no-repeat");
            $(".card_content").css("background-position-x", "30px");
            $(".card_content").css("background-size", "750px 1100px");
            $(".a_box").css("border-radius", "15px");
            $(".m1_box").css("border-radius", "15px");
            $(".m2_box").css("border-radius", "15px");

            $(".card_content").css("background-color", "black");
            
            if (type2) {
                $(".p2_type").show();
                $(".p2_type").attr("src", "img/type/" + type2 + ".png");
                $(".gradient_box").css("background", 
                    "linear-gradient(to left, " + returnTypeColor(type1) + ", " + returnTypeColor(type2) + ")"
                );

                $(".gradient_box_2").css("background", 
                    "linear-gradient(to left, " + returnTypeColor(type1) + ", " + returnTypeColor(type2) + ")"
                );

                $(".c2_type").show();
                $(".c2_type").attr("src", "img/type/" + type2 + ".png");

            }else{
                $(".p2_type").hide();
                $(".gradient_box").css("background", 
                    "linear-gradient(to left, " + returnTypeColor(type1) + ", " + returnTypeColor(type1) + ")"
                );

                $(".gradient_box_2").css("background", 
                    "linear-gradient(to left, " + returnTypeColor(type1) + ", " + returnTypeColor(type1) + ")"
                );

                $(".c2_type").hide();
            }
            renderCost(p.Cost || defaultCost(p.Rarity, type1, type2));
            fitCardName();
            $(".capture_rate").html(p.Points !== undefined && p.Points !== "" ? p.Points : defaultPoints(rarity));
        }

        // ===== Card editor =====
        var curIndex = 0;
        var lastDimsId = null;
        var FORM_FIELDS = {
            "Name": "#edit-name", "Rarity": "#edit-rarity", "Type1": "#edit-type1", "Type2": "#edit-type2",
            "Ability_R_Name": "#edit-ability-name", "Ability_R_Effect": "#edit-ability-effect",
            "Points": "#edit-points", "Cost": "#edit-cost"
        };

        // ===== Balancing notes (CSV columns Note / Note_Priority: 1 important, 2 potential problem, 3 suggestion) =====
        var NOTE_PRIORITIES = { "1": "Important", "2": "Potential problem", "3": "Suggestion" };

        function notePriority(p) {
            if (!p.Note || !p.Note.trim()) return null;
            return NOTE_PRIORITIES[String(p.Note_Priority).trim()] ? String(p.Note_Priority).trim() : "none";
        }

        // Coloured dot in the corner of the roster button, with the note as a tooltip
        function updateNoteIndicator(p) {
            var $btn = $('.pokemon_button[id="' + p.ID + '"]');
            var pr = notePriority(p);
            $btn.find(".note_dot").remove();
            $btn.attr("title", pr ? (NOTE_PRIORITIES[pr] ? NOTE_PRIORITIES[pr] + ": " : "") + p.Note : p.Name);
            if (pr) $btn.append($("<span>", { "class": "note_dot note_p" + pr }));
        }

        // Read-only note box at the top of the Edit Card panel (notes are written by the AI agent)
        function showBalanceNote(p) {
            var pr = notePriority(p);
            var $box = $(".balance-note").attr("class", "balance-note").prop("hidden", !pr);
            $("#save-resolve-btn").prop("hidden", !pr);
            if (!pr) return;
            $box.addClass("note_border_p" + pr);
            $box.find(".note_dot").attr("class", "note_dot note_p" + pr);
            $box.find(".balance-note-label").text(NOTE_PRIORITIES[pr] || "Note");
            $box.find(".balance-note-text").text(p.Note);
            $("#resolve-note-btn").prop("disabled", false).text("Mark resolved").show();
        }

        // Shows the note box as resolved and hides both resolve buttons
        function markNoteResolved() {
            $(".balance-note").attr("class", "balance-note resolved");
            $(".balance-note .note_dot").attr("class", "note_dot note_resolved");
            $(".balance-note-label").text("Resolved ✓");
            $("#resolve-note-btn").hide();
            $("#save-resolve-btn").prop("hidden", true);
        }

        // Clears Note and Note_Priority for this Pokémon in data_r.csv (other columns and unsaved edits are untouched)
        async function resolveNote() {
            var p = aPokemonData[curIndex];
            var $btn = $("#resolve-note-btn").prop("disabled", true).text("Saving…");
            try {
                await writeCsvRow(p.ID, { "Note": "", "Note_Priority": "" });
                p.Note = ""; p.Note_Priority = "";
                updateNoteIndicator(p);
                updateNoteLegend();
                renderDashboard();
                markNoteResolved();
            } catch (e) {
                $btn.prop("disabled", false).text("Mark resolved");
                if (e.name !== "AbortError") alert("Could not resolve the note: " + e.message);
            }
        }

        function updateNoteLegend() {
            var counts = { "1": 0, "2": 0, "3": 0 };
            $.each(aPokemonData, function(i, p) { var pr = notePriority(p); if (counts[pr] != null) counts[pr]++; });
            $(".note-legend").html($.map(NOTE_PRIORITIES, function(label, k) {
                return '<span><span class="note_dot note_p' + k + '"></span>' + counts[k] + ' ' + label.toLowerCase() + '</span>';
            }).join(""));
        }

        // ===== Points & area cost (CSV columns Points / Cost; defaults and type codes live in js/card-rules.js) =====

        // Fills the "?" tooltips in the edit form with every type code and the generic cost symbols
        function buildSymbolReference() {
            var types = $.map(TYPE_CODES, function(code, name) {
                return '<span class="ref-item"><img class="ref-icon" src="img/type/' + name.toLowerCase() + '.png"><code>{' + code + '}</code>' + name + '</span>';
            }).join("");
            var html =
                '<span class="ref-title">Types</span><span class="ref-grid ref-types">' + types + '</span>' +
                '<span class="ref-title">Generic cost</span><span class="ref-grid">' +
                    '<span class="ref-item"><span class="cost_generic ref-pip">2</span><code>{2}</code>Any number: pay that much of any type</span>' +
                    '<span class="ref-item"><span class="cost_generic ref-pip">X</span><code>{X}</code>Variable amount</span>' +
                '</span>' +
                '<span class="ref-title">Ability text only</span><span class="ref-grid">' +
                    '<span class="ref-item"><img class="ref-icon" src="img/type/all.png"><code>{ALL}</code>All types</span>' +
                    '<span class="ref-item"><span class="stat_modifier_yellow">+2</span>&nbsp;<span class="stat_modifier_red">-1</span>&nbsp;Bonus / malus, no braces needed</span>' +
                '</span>' +
                '<span class="ref-foot">Example area cost: {2}{WAT}{WAT}</span>';
            $(".ref-tip-box").html(html);
        }

        // Draws "{2}{WAT}{FIR}" left to right, right-aligned in the top-right corner of the card
        // ===== Card background: the area picture for the card's types =====
        // Dual type: img/area/Type1_Type2.jpg, or Type2_Type1.jpg (each pair exists in one order only, e.g. Flying_Psychic).
        // Single type: img/area/Type.jpg. Nothing found: the old img/background/Type1.jpg.
        var areaBgCache = {};
        function findAreaImage(names) {
            var key = names.join("|");
            if (!areaBgCache[key]) areaBgCache[key] = new Promise(function(resolve) {
                (function tryNext(i) {
                    if (i >= names.length) return resolve(null);
                    var url = "img/area/" + names[i] + ".jpg", img = new Image();
                    img.onload = function() { resolve(url); };
                    img.onerror = function() { tryNext(i + 1); };
                    img.src = url;
                })(0);
            });
            return areaBgCache[key];
        }
        function setCardBackground(p, type1, type2) {
            var t1 = String(type1 || "").trim(), t2 = String(type2 || "").trim();
            var names = t2 && t2 !== t1 ? [t1 + "_" + t2, t2 + "_" + t1] : [t1];
            findAreaImage(names).then(function(url) {
                if (aPokemonData[curIndex] !== p && aPokemonData[curIndex].ID !== p.ID) return; // another card was opened meanwhile
                var $c = $(".card_content");
                // The picture covers the same inner rectangle as the old backgrounds (x 30-780, y 0-1100), so the
                // card's rounded corners outside the frame stay black
                if (url) { $c.addClass("area-bg").css("background-image", "none"); $(".card_bg").css("background-image", "url('" + url + "')"); }
                else $c.removeClass("area-bg").css({ "background-image": "url('img/background/" + t1 + ".jpg')", "background-size": "750px 1100px", "background-position": "30px 0" });
            });
        }

        // Shrinks the card name when it would run into the area cost icons: starts at 50px, never below 32px (print)
        var NAME_MAX_FONT = 50, NAME_MIN_FONT = 32, NAME_COST_GAP = 14;
        function fitCardName() {
            var $n = $(".card_name"), n = $n[0], cost = document.querySelector(".cost_row");
            if (!n) return;
            $n.css({ "font-size": NAME_MAX_FONT + "px", "white-space": "nowrap" });
            var right = cost && cost.offsetWidth ? cost.offsetLeft - NAME_COST_GAP : n.offsetLeft + n.offsetWidth;
            var room = right - n.offsetLeft, size = NAME_MAX_FONT;
            var width = function() { var r = document.createRange(); r.selectNodeContents(n); return r.getBoundingClientRect().width / cardScale(); };
            while (width() > room && size > NAME_MIN_FONT) { size--; $n.css("font-size", size + "px"); }
        }
        // The card may be shown scaled down on screen; measurements in card pixels divide by this
        function cardScale() {
            var card = document.getElementById("capture");
            return card.getBoundingClientRect().width / card.offsetWidth || 1;
        }

        function renderCost(cost) {
            var codeToFile = {};
            $.each(TYPE_CODES, function(t, c) { codeToFile[c] = t.toLowerCase(); });
            var $row = $(".cost_row").empty();
            (String(cost).match(/\{[^}]*\}/g) || []).forEach(function(tok) {
                var code = tok.slice(1, -1).trim().toUpperCase();
                if (codeToFile[code]) {
                    $row.append($("<img>", { "class": "type_icons cost_type", src: "img/type/" + codeToFile[code] + ".png" }));
                } else {
                    $row.append($("<span>", { "class": "cost_generic" + (/^(\d+|X)$/.test(code) ? "" : " unknown"), text: code }));
                }
            });
        }

        $(function() {
            $.each(TYPES, function(i, t) { $(".type-select").append($("<option>", { value: t, text: t })); });
            // Runs before the panel-wide handler below, so the preview shows the new defaults
            $("#edit-rarity, #edit-type1, #edit-type2").on("change", function() {
                var r = $("#edit-rarity").val(), t1 = $("#edit-type1").val(), t2 = $("#edit-type2").val();
                $("#edit-points").val(defaultPoints(r));
                $("#edit-cost").val(defaultCost(r, t1, t2));
            });
            $(".edit-panel").on("input change", "input, select, textarea", function() {
                $("#effect-length").text($("#edit-ability-effect").val().length);
                $(".save-status").text("Unsaved changes").attr("class", "save-status dirty");
                renderCard(readEditForm());
            });
            $("#revert-btn").on("click", function() { loadPokemonData(curIndex); });
            $("#save-btn").on("click", function() { saveCurrentCard(false); });
            $("#save-resolve-btn").on("click", function() { saveCurrentCard(true); });
            $("#resolve-note-btn").on("click", resolveNote);
            buildSymbolReference();
            // Remember whether the Edit Card panel is open or collapsed
            var editPanel = document.querySelector(".edit-panel");
            if (localStorage.getItem("editPanelOpen") === "0") editPanel.open = false;
            editPanel.addEventListener("toggle", function() { localStorage.setItem("editPanelOpen", editPanel.open ? "1" : "0"); });
        });

        function fillEditForm(p) {
            $.each(FORM_FIELDS, function(col, sel) {
                var v = p[col] || "";
                var $el = $(sel);
                // keep unknown values (e.g. a misspelled type) visible instead of silently dropping them
                if ($el.is("select") && v && !$el.find('option[value="' + v + '"]').length) {
                    $el.append($("<option>", { value: v, text: v + " (?)" }));
                }
                $el.val(v);
            });
            $("#effect-length").text((p.Ability_R_Effect || "").length);
            $(".save-status").text("").attr("class", "save-status");
            showBalanceNote(p);
        }

        function readEditForm() {
            var p = $.extend({}, aPokemonData[curIndex]);
            $.each(FORM_FIELDS, function(col, sel) {
                p[col] = String($(sel).val() || "").replace(/\r?\n/g, " ").trim();
            });
            return p;
        }

        function csvField(v) {
            v = String(v == null ? "" : v);
            return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        }

        function idb(mode, fn) {
            return new Promise(function(res, rej) {
                var o = indexedDB.open("pokemonCardEditor", 1);
                o.onupgradeneeded = function() { o.result.createObjectStore("h"); };
                o.onsuccess = function() {
                    var tx = o.result.transaction("h", mode); var q = fn(tx.objectStore("h"));
                    tx.oncomplete = function() { res(q && q.result); }; tx.onerror = rej;
                };
                o.onerror = rej;
            });
        }

        // Returns a writable handle to data/data_r.csv (asks for the Generator folder once, then remembers it)
        async function getCsvHandle() {
            if (!window.showDirectoryPicker) throw new Error("This browser cannot write files. Use Chrome or Edge.");
            var dir = await idb("readonly", function(s) { return s.get("dir"); });
            if (dir && (await dir.requestPermission({ mode: "readwrite" })) === "granted") {
                try { return await (await dir.getDirectoryHandle("data")).getFileHandle("data_r.csv"); } catch (e) {}
            }
            alert("Pick the Generator folder (the one containing index_r.html) so the page can save data/data_r.csv.");
            dir = await window.showDirectoryPicker({ mode: "readwrite" });
            var fh;
            try { fh = await (await dir.getDirectoryHandle("data")).getFileHandle("data_r.csv"); }
            catch (e) { throw new Error("That folder has no data/data_r.csv. Pick the Generator folder itself."); }
            await idb("readwrite", function(s) { return s.put(dir, "dir"); });
            return fh;
        }

        // Re-reads data_r.csv from disk and changes only the given columns of one row, so edits made elsewhere are kept
        async function writeCsvRow(id, changes) {
            var fh = await getCsvHandle();
            var text = await (await fh.getFile()).text();
            var nl = text.indexOf("\r\n") >= 0 ? "\r\n" : "\n";
            var rows = $.csv.toArrays(text);
            while (rows.length && rows[rows.length - 1].join("") === "" && rows[rows.length - 1].length <= 1) rows.pop();
            var header = rows[0];
            var idCol = header.indexOf("ID");
            var row = rows.find(function(r, i) { return i > 0 && r[idCol] === String(id); });
            if (!row) throw new Error("Row with ID " + id + " not found in data_r.csv.");
            $.each(changes, function(col, val) {
                var c = header.indexOf(col);
                if (c >= 0) { while (row.length <= c) row.push(""); row[c] = val; }
            });
            var out = rows.map(function(r) { return r.map(csvField).join(","); }).join(nl) + nl;
            var w = await fh.createWritable(); await w.write(out); await w.close();
        }

        // resolve = true also clears the balancing note in the same write ("Save & mark resolved")
        async function saveCurrentCard(resolve) {
            var p = readEditForm();
            if (resolve) { p.Note = ""; p.Note_Priority = ""; }
            if (!p.Name) { alert("Name cannot be empty."); return; }
            if (p.Type2 && p.Type2 === p.Type1) { alert("Type 2 cannot be the same as Type 1."); return; }
            $(".save-status").text("Saving…").attr("class", "save-status");
            try {
                var changes = {};
                $.each(FORM_FIELDS, function(col) { changes[col] = p[col]; });
                if (resolve) { changes.Note = ""; changes.Note_Priority = ""; }
                await writeCsvRow(p.ID, changes);

                // Update the page without reloading
                var oldName = aPokemonData[curIndex].Name;
                aPokemonData[curIndex] = p;
                var paddedID = String(dexNumber(p)).padStart(4, "0");
                $('#menu_pokemon option[value="' + p.ID + '"]').text("#" + paddedID + " " + p.Name);
                if (oldName !== p.Name) {
                    $('.pokemon_button[id="' + p.ID + '"] img').attr("src", spritePath(p));
                }
                renderCard(p);
                updateNoteIndicator(p);
                updateNoteLegend();
                renderDashboard();
                if (resolve) markNoteResolved();
                $(".save-status").text(resolve ? "Saved and note resolved ✓" : "Saved to data_r.csv ✓").attr("class", "save-status ok");
            } catch (e) {
                if (e.name === "AbortError") { $(".save-status").text("Save cancelled").attr("class", "save-status dirty"); return; }
                $(".save-status").text("Save failed: " + e.message).attr("class", "save-status error");
            }
        }

        function returnRarityColor(Rarity) {
            switch (Rarity) {
                case "A":
                    return "#324aa8"; // blue
                case "B":
                    return "#e352d7"; // pink
                case "E":
                    return "#8421db"; // purple
                case "I":
                    return "#2ebf5c"; // green
                case "L":
                    return "#f5d02f"; // gold
                case "M":
                    return "#e3000b"; // red
                default:
                    return "#FFFFFF"; // white for anything else
            }
        }

        function returnTypeColor(type) {
            switch (type.toLowerCase()) { // make it case-insensitive
                case "normal": return "#A8A77A";
                case "fire": return "#EE8130";
                case "water": return "#6390F0";
                case "electric": return "#F7D02C";
                case "grass": return "#7AC74C";
                case "ice": return "#96D9D6";
                case "fighting": return "#C22E28";
                case "poison": return "#A33EA1";
                case "ground": return "#E2BF65";
                case "flying": return "#A98FF3";
                case "psychic": return "#F95587";
                case "bug": return "#A6B91A";
                case "rock": return "#B6A136";
                case "ghost": return "#735797";
                case "dragon": return "#6F35FC";
                case "dark": return "#3d2e23";
                case "steel": return "#B7B7CE";
                case "fairy": return "#D685AD";
                default: return "#FFFFFF"; // default white if unknown type
            }
        }   
        
        // ===== Regional forms (CSV columns Form and Sprite) =====
        // A form row has its own ID (the PokéAPI number, e.g. 10091 for Alolan Rattata, so PokéAPI data loads directly),
        // Form = Alola / Galar / Hisui / Paldea, and Sprite = the sprite file name, which starts with the National Dex number.
        var FORM_GENERATION = { Alola: 7, Galar: 8, Hisui: 8, Paldea: 9 };
        // Species that only evolve from a regional form (PokéAPI's evolution data doesn't say which form)
        var EVOLVES_FROM_FORM = {
            862: "Galar",  // Obstagoon  <- Galarian Linoone
            863: "Galar",  // Perrserker <- Galarian Meowth
            864: "Galar",  // Cursola    <- Galarian Corsola
            865: "Galar",  // Sirfetch'd <- Galarian Farfetch'd
            866: "Galar",  // Mr. Rime   <- Galarian Mr. Mime
            867: "Galar",  // Runerigus  <- Galarian Yamask
            903: "Hisui",  // Sneasler   <- Hisuian Sneasel
            904: "Hisui",  // Overqwil   <- Hisuian Qwilfish
            980: "Paldea"  // Clodsire   <- Paldean Wooper
        };
        function dexNumber(p) { return p.Sprite ? parseInt(p.Sprite, 10) : parseInt(p.ID, 10); }
        function spritePath(p) { return "img/sprite/" + (p.Sprite || String(p.ID).padStart(4, "0") + " " + p.Name) + ".png"; }
        function pokemonRegion(p) { return p.Form || getPokemonRegion(dexNumber(p)); }
        function pokemonGeneration(p) { return FORM_GENERATION[p.Form] || getPokemonGeneration(dexNumber(p)); }
        function indexOfId(id) {
            var i = aPokemonData.findIndex(function(p) { return String(p.ID) === String(id); });
            return i < 0 ? 0 : i;
        }

        function getPokemonGeneration(id) {

            id = parseInt(id, 10);

            if (isNaN(id) || id <= 0) return null;

            if (id <= 151) return 1;
            if (id <= 251) return 2;
            if (id <= 386) return 3;
            if (id <= 493) return 4;
            if (id <= 649) return 5;
            if (id <= 721) return 6;
            if (id <= 809) return 7;
            if (id <= 905) return 8;
            if (id <= 1025) return 9;

            return null; // future Pokémon
        }

        function getPokemonRegion(id) {

            id = parseInt(id, 10);

            if (isNaN(id) || id <= 0) return null;

            if (id <= 151) return "Kanto";
            if (id <= 251) return "Johto";
            if (id <= 386) return "Hoenn";
            if (id <= 493) return "Sinnoh";
            if (id <= 649) return "Unova";
            if (id <= 721) return "Kalos";
            if (id <= 809) return "Alola";
            if (id <= 905) return "Galar";
            if (id <= 1025) return "Paldea";

            return null; // future Pokémon
        }

        function replaceTypeIcons(text) {
            const iconMap = {
                "ALL": "all.png",
                "BUG": "bug.png",
                "DRK": "dark.png",
                "DRG": "dragon.png",
                "ELE": "electric.png",
                "FAR": "fairy.png",
                "FIG": "fighting.png",
                "FIR": "fire.png",
                "FLY": "flying.png",
                "GHO": "ghost.png",
                "GRA": "grass.png",
                "GRD": "ground.png",
                "ICE": "ice.png",
                "NOR": "normal.png",
                "POS": "poison.png",
                "PSY": "psychic.png",
                "ROC": "rock.png",
                "STE": "steel.png",
                "WAT": "water.png"
            };

            // Matches EITHER {braced_code} OR standalone +number/-number/+X/-X
            return text.replace(/\{([A-Za-z0-9]+)\}|([+-][\dX\x]+)/g, function(match, bracedCode, statModifier) {

                // 1. Handle standalone +2, -1, +X, -X (no braces required)
                if (statModifier) {
                    const isNegative = statModifier.startsWith('-');
                    const colorClass = isNegative ? "stat_modifier_red" : "stat_modifier_yellow";
                    return `<span class="${colorClass}">${statModifier.toUpperCase()}</span>`;
                }

                // 2. Handle braced items: {3}, {X} -> PIP
                if (/^(\d+|x)$/i.test(bracedCode)) {
                    return `<span class="numeric_pip move_icons_text">${bracedCode.toUpperCase()}</span>`;
                }

                // 3. Handle braced items: {ELE} -> Type Icon
                let upperCode = bracedCode.toUpperCase();
                if (iconMap[upperCode]) {
                    return `<img class="move_icons_text" src="img/type/${iconMap[upperCode]}">`;
                }

                return match;
            });
        }

        /**
         * Fetches a Pokémon's height and weight by name or ID.
         * @param {string|number} pokemonNameOrId - The name or ID of the Pokémon.
         */
        // PokéAPI egg group ids -> names used in the games
        const EGG_GROUP_NAMES = {
            "monster": "Monster", "water1": "Water 1", "water2": "Water 2", "water3": "Water 3",
            "bug": "Bug", "flying": "Flying", "ground": "Field", "fairy": "Fairy", "plant": "Grass",
            "humanshape": "Human-Like", "mineral": "Mineral", "indeterminate": "Amorphous",
            "ditto": "Ditto", "dragon": "Dragon", "no-eggs": "Undiscovered"
        };

        // Info bar layout. Weight and height are right-aligned: the height ends at BAR_END and everything else is placed
        // leftward from it using each text's real width. Egg groups sit on the left, start at 40px and shrink to fit the
        // space left before the weight, but never below 32px (smaller is hard to read in print).
        var BAR_END = 741;      // right edge for the height text (the bar itself ends at 751)
        var ICON_GAP = 5;       // between an icon and its text
        var GROUP_GAP = 24;     // between the weight and the ruler icon
        var EGG_GAP = 14;       // minimum space between the egg groups and the weight icon
        function textWidth($el) {
            var old = $el[0].style.width;
            $el.css({ width: "auto", "white-space": "nowrap" });
            var w = $el[0].offsetWidth;
            $el[0].style.width = old;
            return w;
        }
        function fitEggGroups() {
            var $egg = $(".egg_groups"), $wi = $(".weight_icon"), $w = $(".weight"), $ri = $(".ruler_icon"), $h = $(".height");
            var hLeft  = BAR_END - textWidth($h);
            var riLeft = hLeft - ICON_GAP - $ri[0].offsetWidth;
            var wLeft  = riLeft - GROUP_GAP - textWidth($w);
            var wiLeft = wLeft - ICON_GAP - $wi[0].offsetWidth;
            $h.css("left", hLeft + "px");   $ri.css("left", riLeft + "px");
            $w.css("left", wLeft + "px");   $wi.css("left", wiLeft + "px");

            $egg.css("width", "");
            var room = wiLeft - EGG_GAP - $egg[0].offsetLeft;
            for (var size = 40; size > 32; size--) {
                $egg.css("font-size", size + "px");
                if (textWidth($egg) <= room) break;
            }
            $egg.css({ "font-size": size + "px", width: room + "px" });
        }

        // ===== Evolution stage, TCG terms: Basic / Stage 1 / Stage 2 =====
        // Counts the species this one evolves from, skipping baby Pokémon as the TCG does
        // (Pichu -> Pikachu: Pikachu is Basic; Raichu is Stage 1; Mime Jr. -> Mr. Mime: Mr. Mime is Basic).
        var speciesCache = {};
        function getSpecies(url) {
            if (!speciesCache[url]) speciesCache[url] = fetch(url).then(function(r) {
                if (!r.ok) throw new Error("species " + r.status);
                return r.json();
            });
            return speciesCache[url];
        }
        async function getStage(species) {
            var count = 0, from = null, prev = species.evolves_from_species;
            while (prev) {
                var s = await getSpecies(prev.url);
                if (!s.is_baby) {
                    count++;
                    if (!from) from = { id: parseInt(prev.url.split("/").filter(Boolean).pop(), 10), name: s.name };
                }
                prev = s.evolves_from_species;
            }
            return { stage: Math.min(count, 2), from: from };
        }
        // Stage badge from the CSV: Stage = Basic / Stage 1 / Stage 2, Evolves_From = ID of the card shown in the bubble
        function renderStageFromCsv(p) {
            var $box = $(".stage_box").prop("hidden", false);
            $box.find(".stage_label").text(String(p.Stage).trim().toUpperCase());
            var pre = p.Evolves_From ? $.grep(aPokemonData, function(x) { return String(x.ID) === String(p.Evolves_From).trim(); })[0] : null;
            $box.toggleClass("evolved", !!pre);
            if (pre) $box.find(".evo_sprite").attr({ src: spritePath(pre), alt: pre.Name });
        }

        // Fallback when the CSV has no Stage: worked out from PokéAPI
        function renderStage(st) {
            var $box = $(".stage_box");
            if (!st) { $box.prop("hidden", true); return; }
            $box.prop("hidden", false);
            $box.find(".stage_label").text(st.stage === 0 ? "BASIC" : "STAGE " + st.stage);
            // Bubble with the pre-evolution's sprite. A regional form evolves from the same region's form when there is one
            // (Alolan Raticate <- Alolan Rattata), otherwise from the normal form (Alolan Raichu <- Pikachu).
            var p = null;
            if (st.stage > 0 && st.from) {
                var cur = aPokemonData[curIndex] || {};
                var form = cur.Form || EVOLVES_FROM_FORM[dexNumber(cur)];
                var pre = $.grep(aPokemonData, function(x) { return x.Name && dexNumber(x) === st.from.id; });
                p = $.grep(pre, function(x) { return form && x.Form === form; })[0] || $.grep(pre, function(x) { return !x.Form; })[0] || pre[0] || null;
            }
            $box.toggleClass("evolved", !!p);
            if (p) $box.find(".evo_sprite").attr({ src: spritePath(p), alt: p.Name });
        }

        async function getPokemonDimensions(pokemonNameOrId) {
        // PokéAPI requires names to be lowercase
        const searchName = pokemonNameOrId.toString().toLowerCase().trim();
        const url = `https://pokeapi.co/api/v2/pokemon/${searchName}`;

        try {
            const response = await fetch(url);
            
            if (!response.ok) {
            throw new Error(`Pokémon "${pokemonNameOrId}" not found.`);
            }

            const data = await response.json();

            // Egg groups and the evolution stage live on the species endpoint, not the pokemon endpoint
            let eggGroups = [], stage = null;
            try {
                const species = await getSpecies(data.species.url);
                eggGroups = species.egg_groups.map(g => EGG_GROUP_NAMES[g.name] || g.name);
                stage = await getStage(species);
            } catch (e) {
                console.error("Error fetching species:", e.message);
            }
            
            // Extract and convert raw units (decimeters & hectograms)
            const heightInMeters = data.height / 10; 
            const weightInKilograms = data.weight / 10; 

            return {
            name: data.name,
            id: data.id,
            height: {
                raw: data.height,
                meters: heightInMeters,
                cm: data.height * 10
            },
            weight: {
                raw: data.weight,
                kg: weightInKilograms
            },
            eggGroups: eggGroups,
            stage: stage
            };
        } catch (error) {
            console.error("Error fetching Pokémon data:", error.message);
            return null;
        }
        }

    </script>
