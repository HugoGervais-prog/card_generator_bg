<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon area card generator</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="css/style_item.css" rel="stylesheet">

    <script src="https://code.jquery.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/jquery-google-sheet-to-json.js"></script>
    <script src="js/jquery.csv.js"></script>

</head>
<body>

    <!-- Header 
    <header>
        <h1>Pokemon Card Generator</h1>
    </header>-->

    <!-- Main Content -->
    <main>
        <div style="float:left;" class="card_content" id="capture">
            <!-- Frame -->
            <img class="card_frame" src="img/base_frame/N_simple_area_void.png" width="810" height="1110">

            <!-- Name 
            <p class="card_name"></p>-->

            <!-- Name -->
            <p class="mana_cost">XXXX</p>

            <!-- Copyright -->
            <p class="copyright">Area - <span class="nbSerie">001</span>/<span class="totalArea">001</span></p>

        </div>

        <select id="menu_pokemon" style="float:left;font-size:16px;margin-left:10px;padding: 10px;">
            <option></option>
        </select>
        <button style="float:left;font-size:16px;margin-left:10px;padding: 10px;width:40%;" id="download-btn">Download Image (Make sure zoom is at 100%)</button>
        <p class="total">0 / 0 feuilles</p>

        <div class="button_table">
        <div>

    </main>

    <!-- Script -->
    <script>
        var aItemData;
       $(document).ready(function() {
            $("#download-btn").click(function() {
                const element = document.getElementById('capture');

                // Ajout des options pour gérer le Cross-Origin (CORS)
                html2canvas(element, {
                    useCORS: true,        // Autorise le chargement d'images externes via CORS
                    allowTaint: false,    // Empêche de "souiller" le canvas avec des données non sécurisées
                    logging: false        // Changez en true si vous voulez déboguer dans la console
                }).then(canvas => {
                    try {
                        // Création du lien de téléchargement
                        const link = document.createElement('a');
                        link.download = $(".nbSerie").html() + '.png';
                        
                        // On génère l'URL de l'image
                        link.href = canvas.toDataURL("image/png");

                        // Ajout, clic et suppression du lien
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    } catch (err) {
                        console.error("Erreur lors de l'exportation de l'image :", err);
                        alert("Impossible de capturer l'image à cause de restrictions de sécurité sur certaines ressources (CORS).");
                    }
                });
            });

            $.ajax({
                url: 'data/area.csv', // Path to your CSV file
                dataType: 'text',
                success: function(csvData) {
                    // Process the data once it's successfully loaded
                    parseCsvWithPlugin(csvData);
                }
            });

        });

        function parseCsvWithPlugin(csvData) {
            // Convert to a 2D array
            var arrayData = $.csv.toArrays(csvData);
            var lastId = 0;

            var params = new URLSearchParams(window.location.search);
            var urlId = params.get("id");

            // Convert to an array of objects (useful if your CSV has a header row)
            aItemData = $.csv.toObjects(csvData);
            console.log(aItemData);
            //Fill Menu deroulant with list of pokemon
            var $select = $("#menu_pokemon");
            var totalItem = 0;
            

            // Remove existing options
            $select.empty();
            $.each(aItemData, function(index, item) {
                
                if (item.Name && item.Name.trim() !== "") {
                    lastId = parseInt(item.ID, 10) - 1;
                    $select.append(
                        $("<option>", {
                            value: item.ID,
                            text: "#" + item.ID + " " + item.Name,
                            selected: urlId ? (item.ID == urlId) : true
                        })
                        
                    );
                    totalItem = totalItem+1;
                    $(".button_table").append('<button class="pokemon_button" id="' + parseInt(item.ID) + '"><img src="img/area/' + item.Name + '.jpg"></button>');


                }

            });

            $(".total").html(totalItem + ' / ' + (totalItem/9).toFixed(2)  + ' sheets');

            $(".totalArea").html(totalItem);

            $select.on("change", function() {

                var selectedValue = $(this).val();

                // Add ID to URL as parameter
                var url = new URL(window.location);
                url.searchParams.set("id", selectedValue);
                window.history.replaceState({}, "", url);

                // Load the data
                loadItemData(selectedValue - 1);

            });

            if (urlId) {
                loadItemData(parseInt(urlId, 10) - 1);
            } else {
                loadItemData(lastId);
            }

            $(".pokemon_button").on("click", function() {

                var id = parseInt(this.id, 10);

                // Update select menu
                $("#menu_pokemon").val(id);

                // Update URL
                var url = new URL(window.location);
                url.searchParams.set("id", id);
                window.history.replaceState({}, "", url);

                // Load Pokémon data
                loadItemData(id-1);

            });

        }

        function loadItemData(index) {
            var indexItem = index;
            var ID = aItemData[indexItem].ID;
            var name = aItemData[indexItem].Name;
            var Title = aItemData[indexItem].Title;
            var mana = aItemData[indexItem].Mana;

            $(".card_name").html(Title);

            $(".mana_cost").html(replaceTypeIcons(mana));

            $(".card_content").css("background-image", "url('../img/area/" + name + ".jpg')");

            $(".nbSerie").html(String(index+1).padStart(3, '0'));
        }

        function replaceTypeIcons(text) {
            const iconMap = {
                "ALL": "all.png",
                "BUG": "bug.png",
                "DRK": "dark.png",
                "DRG": "dragon.png",
                "ELE": "electric.png",
                "FAR": "fairy.png",
                "FIG": "fighting.png",
                "FIR": "fire.png",
                "FLY": "flying.png",
                "GHO": "ghost.png",
                "GRA": "grass.png",
                "GRD": "ground.png",
                "ICE": "ice.png",
                "NOR": "normal.png",
                "POS": "poison.png",
                "PSY": "psychic.png",
                "ROC": "rock.png",
                "STE": "steel.png",
                "WAT": "water.png"
            };

            // Matches EITHER {braced_code} OR standalone +number/-number/+X/-X
            return text.replace(/\{([A-Za-z0-9]+)\}|([+-][\dX\x]+)/g, function(match, bracedCode, statModifier) {

                let upperCode = bracedCode.toUpperCase();
                if (iconMap[upperCode]) {
                    return `<img class="move_icons_text" src="img/type/${iconMap[upperCode]}">`;
                }

                return match;
            });
        }
    </script>

</body>
</html>
